<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" href="/Day7/src/logo-blog-contact.jpg"
        type="image/jpg" sizes="(16x16 32x32)">
    <link rel="stylesheet" href="sytle.css">
</head>
<body>
    <h1>Contact Us</h1>
    <p>Got a travel story to share? Questions about our adventures? Drop a message!</p>

    <form action="/submit-form" method="POST">
        <label for="name">Contact Name:</label>
        <input type="text" placeholder="Enter your name"
                name="name" id="name">

        <label for="email">Email:</label>
        <input type="email" placeholder="example@gmail.com"
                name="email" id="email">
        
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject">

        <label for="message">Message:</label>
        <textarea name="text" id="text" rows="4" required></textarea>

        <input type="submit" value="Send Message">
    </form>
</body>
</html>
